# Live scallop meat counting defaults for a 1280x720, 30 FPS camera stream.
camera_config: configs/camera/camera.yaml

counting:
  mode: line  # line: original directional crossing; roi: first tracked center inside ROI

model:
  directory: weights/scallop_meat  # 网页从此目录列出可选的 .pt 权重
  weights: weights/scallop_meat/scallop_meat_v1_20261005_best.pt
  imgsz: 960
  conf: 0.10
  iou: 0.45
  device: 0
  classes: [0]

tracking:
  tracker: bytetrack.yaml
  min_track_frames: 3

# Set this ROI and line to match the belt in the live camera view.
roi:
  x: 0
  y: 0
  width: 1280
  height: 720

count_line:
  start: [640, 0]
  end: [640, 720]
  direction: negative_to_positive
  deadband_px: 4
