<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>扇贝个数实时检测</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='count.css') }}">
</head>
<body>
  <div class="count-app">
    <main class="count-layout">
      <section class="monitor-panel">
        <div class="monitor-toolbar"><div><span class="live-dot" id="live-dot"></span><span id="monitor-state">未开始监测</span></div><span id="frame-meta">等待相机画面</span></div>
        <div class="monitor-stage"><img id="count-frame" alt="扇贝肉传送带实时检测画面"><div class="stage-empty" id="stage-empty">点击右侧“开始监测”显示实时检测画面</div></div>
      </section>
      <aside class="control-column">
        <section class="metric-strip"><div class="metric-main"><strong id="count-value">0</strong><span>累计计数</span></div><div><strong id="detect-value">0</strong><span>当前目标</span></div><div><strong id="count-fps-value">0.0</strong><span>推理 FPS</span></div></section>
        <section class="control-panel"><div class="panel-heading"><h2>监测控制</h2><span class="status-chip" id="error-chip" hidden>异常</span></div><div class="actions"><button class="btn primary" id="start-button" type="button">开始监测</button><button class="btn" id="stop-button" type="button" disabled>停止</button><button class="btn" id="reset-button" type="button">清零</button></div><p class="error-text" id="error-text" hidden></p></section>
        <section class="control-panel"><div class="panel-heading"><h2>检测参数</h2></div><div class="field-grid"><label>置信度 <input id="conf-input" type="number" min="0.01" max="0.99" step="0.01" value="0.10"></label><label>输入尺寸 <select id="imgsz-input"><option value="640">640</option><option value="960" selected>960</option><option value="1280">1280</option></select></label><label>ROI X <input id="roi-x" type="number" min="0" value="0"></label><label>ROI Y <input id="roi-y" type="number" min="0" value="0"></label><label>ROI 宽度 <input id="roi-width" type="number" min="1" value="1280"></label><label>ROI 高度 <input id="roi-height" type="number" min="1" value="720"></label></div><p class="field-help">画面中的黄色框是检测区域，红线是计数线。先用较低置信度确认是否漏检，再逐步提高。</p></section>
        <section class="control-panel"><div class="panel-heading"><h2>计数规则</h2></div><div class="field-grid"><label>运动方向 <select id="direction-input"><option value="negative_to_positive" selected>负侧 → 正侧</option><option value="positive_to_negative">正侧 → 负侧</option></select></label><label>计数线 X <input id="line-x" type="number" min="0" value="640"></label><label>死区像素 <input id="deadband-input" type="number" min="0" value="4"></label></div><p class="field-help">同一个跟踪 ID 只计数一次；清零后新的有效穿线从 1 开始。</p></section>
      </aside>
    </main>
  </div>
  <script src="{{ url_for('static', filename='count.js') }}" defer></script>
</body>
</html>
